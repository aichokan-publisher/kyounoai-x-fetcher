name: Single Latest search check
on:
  push:
    branches: [main]
    paths: ['checks/one-latest.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check one search
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: node checks/one-latest.mjs
